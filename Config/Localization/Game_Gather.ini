[CommonSettings]
SourcePath=%LOCPROJECTROOT%Content/Localization/Game
DestinationPath=%LOCPROJECTROOT%Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
ResourceName=Game.locres
NativeCulture=ko
CulturesToGenerate=ko
CulturesToGenerate=en
CulturesToGenerate=ja

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=%LOCPROJECTROOT%Source/CatchTheTail
SearchDirectoryPaths=%LOCPROJECTROOT%Config
ExcludePathFilters=%LOCPROJECTROOT%Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=%LOCPROJECTROOT%Content/UI/*
IncludePathFilters=%LOCPROJECTROOT%Content/Core/*
IncludePathFilters=%LOCPROJECTROOT%Content/Character/Player/*
IncludePathFilters=%LOCPROJECTROOT%Content/Levels/L_Mainmenu*
IncludePathFilters=%LOCPROJECTROOT%Content/Levels/L_Lobby*
ExcludePathFilters=%LOCPROJECTROOT%Content/Localization/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldExcludeDerivedClasses=false
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=true

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true
