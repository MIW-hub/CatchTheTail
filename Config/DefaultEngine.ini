; ---- EOS 방(로비) 구조: 방 코드로 찾을 수 있게 기본 구조(LobbyBase)에 RoomCode 를 검색 가능한 값으로 추가 (OnlineServicesEOSGS) ----
; 검색 가능한 값은 기본 구조에만 둘 수 있어서 기본 구조의 값 목록을 지우고 RoomCode 를 더해 다시 등록함
[OnlineServices.Lobbies]
-SchemaCategoryAttributeDescriptors=(SchemaId="LobbyBase", CategoryId="Lobby", AttributeIds=("SchemaCompatibilityId"))
+SchemaCategoryAttributeDescriptors=(SchemaId="LobbyBase", CategoryId="Lobby", AttributeIds=("SchemaCompatibilityId", "RoomCode"))
+SchemaAttributeDescriptors=(Id="RoomCode", Type="String", Flags=("Public", "Searchable"), MaxSize=16)
; 방은 기본 구조의 자식 구조로 만들어야 해서 비어 있는 자식 구조를 둠 (자식은 카테고리를 가질 수 없음)
+SchemaDescriptors=(Id="HeyChickenLobby", ParentId="LobbyBase")

; ---- 음성 입력 크기 (EOS 브랜치) ----
; 스팀 음성은 자동으로 크기를 맞춰 주었지만, 엔진 기본 음성은 마이크 소리를 그대로 보내서 작게 들림. 마이크 입력을 키움 (1.0 = 그대로)
[SystemSettings]
voice.MicInputGain=2.0
